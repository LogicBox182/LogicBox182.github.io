<!DOCTYPE html>
<html lang="en">

  <head>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <title>Wakati Safaris Adventure</title>
    <link rel="stylesheet" href="assets/css/social.css">

  </head>

<body>


    <!-- START OF FORM -->

      <!-- Form -->
<div class="form">
  
    <div class="form-toggle"></div>
  
    <!-- Login Panel -->
    <div class="form-panel one">
      
      <div class="form-header">
        <h1>Account Login</h1>
      </div>
  
      <div class="form-content">
        <form>
  
          <div class="form-group">
            <label for="username">Username</label>
            <input
              type="text"
              id="username"
              name="username"
              required
            >
          </div>
  
          <div class="form-group">
            <label for="password">Password</label>
            <input
              type="password"
              id="password"
              name="password"
              required
            >
          </div>
  
          <div class="form-group">
            <label class="form-remember">
              <input type="checkbox">
              Remember Me
            </label>
  
            <a class="form-recovery" href="#">
              Forgot Password?
            </a>
          </div>
  
          <div class="form-group">
            <button type="submit">Log In</button>
          </div>
  
        </form>
      </div>
    </div>
  
    <!-- Register Panel -->
    <div class="form-panel two">
  
      <div class="form-header">
        <h1>Register Account</h1>
      </div>
  
      <div class="form-content">
        <form>
  
          <div class="form-group">
            <label for="register-username">Username</label>
            <input
              type="text"
              id="register-username"
              name="username"
              required
            >
          </div>
  
          <div class="form-group">
            <label for="register-password">Password</label>
            <input
              type="password"
              id="register-password"
              name="password"
              required
            >
          </div>
  
          <div class="form-group">
            <label for="cpassword">Confirm Password</label>
            <input
              type="password"
              id="cpassword"
              name="cpassword"
              required
            >
          </div>
  
          <div class="form-group">
            <label for="email">Email Address</label>
            <input
              type="email"
              id="email"
              name="email"
              required
            >
          </div>
  
          <div class="form-group">
            <button type="submit">Register</button>
          </div>
  
        </form>
      </div>
    </div>
  </div>
  
  <div class="pen-footer">
    
    <a href="https://www.behance.net/gallery/30478397/Login-Form-UI-Library" target="_blank">
      <i class="material-icons">arrow_backward</i>
      View on Behance
    </a>
  
    <a href="https://github.com/andyhqtran/UI-Library/tree/master/Login%20Form" target="_blank">
      View on Github
      <i class="material-icons">arrow_forward</i>
    </a>
  
  </div>

    <!-- END OF FORM -->

    <script src="vendor/jquery/jquery.min.js"></script>
  <script src="vendor/bootstrap/js/bootstrap.min.js"></script>

  <script>
    
    $(document).ready(function() {
  var panelOne = $('.form-panel.two').height(),
    panelTwo = $('.form-panel.two')[0].scrollHeight;

  $('.form-panel.two').not('.form-panel.two.active').on('click', function(e) {
    e.preventDefault();

    $('.form-toggle').addClass('visible');
    $('.form-panel.one').addClass('hidden');
    $('.form-panel.two').addClass('active');
    $('.form').animate({
      'height': panelTwo
    }, 200);
  });

  $('.form-toggle').on('click', function(e) {
    e.preventDefault();
    $(this).removeClass('visible');
    $('.form-panel.one').removeClass('hidden');
    $('.form-panel.two').removeClass('active');
    $('.form').animate({
      'height': panelOne
    }, 200);
  });
});

  </script>

</body>
</html>
